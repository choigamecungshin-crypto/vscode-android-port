name: Android APK

# Builds the ARM64 debug APK of the Android shell (M1.5): bundles the VS Code mobile
# web workbench into out-mobile/, copies it into the shell's assets and assembles the
# APK with the Gradle wrapper. The APK is uploaded as a workflow artifact and is never
# committed to the repository.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'build/next/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # Installs the apt packages of packages.txt, which include libkrb5-dev (kerberos).
      - name: Install system packages
        uses: ./.github/actions/install-linux-packages

      - name: Install dependencies
        run: |
          set -o pipefail

          status=1
          for i in {1..5}; do
            if pnpm install --frozen-lockfile --reporter=append-only 2>&1 | tee /tmp/install.log; then
              status=0
              break
            fi
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              break
            fi
            echo "pnpm install failed $i, trying again..."
            sleep 10
          done
          exit $status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle the VS Code mobile workbench
        run: |
          set -o pipefail
          BUILD_SOURCEVERSION="$GITHUB_SHA" pnpm run bundle-mobile 2>&1 | tee /tmp/bundle.log

      - name: Copy the mobile bundle into the Android assets
        run: node android/scripts/sync-android-assets.mjs

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools'

      - name: Assemble the debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Verify the APK contains the mobile bundle
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$apk"
          entries=$(unzip -l "$apk" | grep -c 'assets/vscode-mobile/' || true)
          echo "assets/vscode-mobile entries: $entries"
          test "$entries" -gt 1
          unzip -p "$apk" assets/vscode-mobile/index.html | grep -q 'appassets.androidplatform.net'

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # The job summary is readable without a GitHub sign-in, unlike the step logs.
      - name: Collect failure diagnostics
        if: failure()
        run: |
          {
            echo '### Android APK build diagnostics'
            for f in /tmp/install.log /tmp/bundle.log /tmp/gradle.log; do
              if [ -f "$f" ]; then
                echo "#### \`$f\` (last 80 lines)"
                echo '```'
                tail -80 "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/install.log ]; then
            echo "::error title=Install dependencies failed::$(tail -20 /tmp/install.log | tr '\n' ' ' | cut -c1-900)"
          fi
          if [ -f /tmp/bundle.log ]; then
            echo "::error title=Bundle mobile failed::$(tail -20 /tmp/bundle.log | tr '\n' ' ' | cut -c1-900)"
          fi
          if [ -f /tmp/gradle.log ]; then
            echo "::error title=Gradle assembleDebug failed::$(tail -20 /tmp/gradle.log | tr '\n' ' ' | cut -c1-900)"
          fi
